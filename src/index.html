<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeremiah Angeles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0e6d2; /* Khaki background */
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #8b5a2b; /* Brown background */
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        img {
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        h1 {
            color: #fff; /* White text */
        }

        p {
            color: #f0e6d2; /* Khaki text */
            font-size: 18px;
            line-height: 1.5;
        }

        .highlight {
            font-weight: bold;
            color: #ffd700; /* Gold highlight */
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #d2b48c; /* Khaki button */
            color: #8b5a2b; /* Brown text */
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background: #a0744b; /* Darker brown */
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="highlight">Jeremiah Angeles</h1>
        <p>Hi! I'm your future <span class="highlight">Programmer!git</span>. Let me introduce myself to you. Welcome to my simple portfolio where I showcase my skills and experiences in coding and development.</p>
        <img src="5d74e9e2-d779-42ee-861a-86ab50cc04f3.jpg" alt="Jeremiah Angeles">
        <div class="btn-container">
            <a href="#" class="btn">View More</a>
        </div>
    </div>
</body>

</html>
